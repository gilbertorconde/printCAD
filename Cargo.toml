[workspace]
members = [
  "crates/app_shell",
  "crates/core_document",
  "crates/bench_panel",
  "crates/feature_walk",
  "crates/sketch_solver",
  "crates/metrology",
  "crates/image_edges",
  "crates/bench_api",
  "crates/doc_server",
  "crates/doc_render",
  "crates/kernel_api",
  "crates/kernel_ogeom",
  "crates/project_tools",
  "crates/project_archive",
  "crates/render_wgpu",
  "crates/workbenches",
  "crates/workbenches/fixtures",
  "crates/workbenches/wb_assembly",
  "crates/workbenches/wb_wasm",
  "crates/workbenches/wb_surface",
  "crates/workbenches/wb_inspect",
  "crates/workbenches/wb_mesh",
  "crates/settings",
  "crates/axes",
  "crates/ui_kit",
  "crates/scripting",
  "crates/agents",
  "crates/local_ipc",
  "crates/viewport_camera",
  "crates/transform_gizmo",
]
resolver = "2"
# Workbench packages build apart, for wasm32-wasip2.
exclude = ["sdk"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"

[workspace.metadata]
description = "Workspace for the printCAD parametric CAD application."

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23"
sha2 = "0.11"
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26", features = ["serde", "v4", "v5"] }
winit = "0.30.13"
egui = "0.36"
egui-winit = "0.36"
egui-wgpu = "0.36"
# egui's maths; transform_gizmo, copied to other applications, keeps its own.
emath = "0.36"
# The shader validator, at the version wgpu (through egui-wgpu) runs.
naga = "30"
pollster = "0.4"
bytemuck = "1.25"
directories = "6.0"
glam = { version = "0.33", features = ["std"] }
tar = "0.4.46"
flate2 = "1.1.10"
zstd = "0.14"
rmp-serde = "1"
# project_archive, built outside the workspace too, keeps its own.
zip = { version = "2", default-features = false }
# Each crate names the formats it decodes.
image = { version = "0.25", default-features = false }
# SVG rasterizing. Icons need no text; a crate that draws text names
# `text` and the font features it needs.
resvg = { version = "0.48", default-features = false }
usvg = { version = "0.48", default-features = false }
tiny-skia = "0.12"
rustc-hash = "2.1"
rayon = "1.12"
ogeom = "0.18.1"
sixdof = { version = "0.2", features = ["magellan"] }
mlua = { version = "0.12", features = ["lua54", "vendored", "serde"] }
# Published for workbench packages under these names; `exhaustive` lets the
# app, which makes every variant it sends, match without a wildcard.
kernel_api = { package = "printcad-kernel-api", path = "crates/kernel_api", version = "0.1.7", features = ["exhaustive"] }
bench_api = { package = "printcad-bench-api", path = "crates/bench_api", version = "0.1.7", features = ["exhaustive"] }

# The geometry kernel is numeric code that runs unoptimized in a plain
# `cargo run`, where it is ~26x slower — enough to make a large STEP import
# look like a hang. Optimize dependencies even in dev builds; our own crates
# stay unoptimized so rebuilds are fast and backtraces stay readable.
[profile.dev]
# Line tables keep backtraces' file:line. Full debug info (the variables a
# debugger shows) makes every test program larger and a test build of the
# workspace about a fifth slower, paid by each edit-test loop and CI run;
# a debugging session sets CARGO_PROFILE_DEV_DEBUG=full.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
# Line tables keep a backtrace through a dependency readable; full debug
# info for the kernel, wasmtime, egui and the rest made each test program
# hundreds of megabytes, written again at every link.
debug = "line-tables-only"

[patch.crates-io]
# Uncomment to build against a local checkout instead of the released crate:
#ogeom = { path = "../openGeometry/crates/ogeom" }
#sixdof = { path = "../sixdof" }
