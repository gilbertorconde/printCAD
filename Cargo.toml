[workspace]
members = [
  "crates/app_shell",
  "crates/core_document",
    "crates/doc_server",
  "crates/kernel_api",
  "crates/kernel_ogeom",
  "crates/render_vk",
  "crates/workbenches",
"crates/settings",
"crates/axes",
]
resolver = "2"

# The geometry kernel is numeric code that runs unoptimized in a plain
# `cargo run`, where it is ~26x slower — enough to make a large STEP import
# look like a hang. Optimize dependencies even in dev builds; our own crates
# stay unoptimized so rebuilds are fast and backtraces stay readable.
[profile.dev.package."*"]
opt-level = 3

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.92"

[workspace.metadata]
description = "Workspace for the printCAD parametric CAD application."

[workspace.dependencies]
anyhow = "1.0.100"
ash = { version = "0.38", default-features = false, features = ["linked"] }
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive", "rc"] }
thiserror = "2.0.17"
tracing = "0.1.41"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
winit = "0.30.13"
raw-window-handle = "0.6.2"
egui = "0.34.2"
egui-winit = "0.34.2"
egui-ash-renderer = { path = "crates/egui-ash-renderer-vendored" }
bytemuck = "1.14"
directories = "6.0"
glam = { version = "0.32", features = ["std"] }
tar = "0.4.44"
flate2 = "1.1.5"
zstd = "0.13.3"
once_cell = "1.19"
rustc-hash = "2.0"
rayon = "1.10"
ogeom = { git = "https://github.com/gilbertorconde/ogeom-rs", rev = "7883f8a1a092efcc463284390665b2c94507d9e7" }

# Uncomment to develop against the local kernel checkout instead of the pin:
# [patch."https://github.com/gilbertorconde/ogeom-rs"]
# ogeom = { path = "../openGeometry/crates/ogeom" }
