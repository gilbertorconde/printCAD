[workspace]
members = [
  "crates/app_shell",
  "crates/core_document",
  "crates/sketch_solver",
  "crates/bench_api",
  "crates/doc_server",
  "crates/kernel_api",
  "crates/kernel_ogeom",
  "crates/render_wgpu",
  "crates/workbenches",
  "crates/workbenches/fixtures",
  "crates/workbenches/wb_assembly",
  "crates/workbenches/wb_wasm",
  "crates/workbenches/wb_surface",
  "crates/settings",
  "crates/axes",
  "crates/ui_kit",
  "crates/scripting",
  "crates/agents",
  "crates/local_ipc",
  "crates/viewport_camera",
  "crates/transform_gizmo",
]
resolver = "2"
# Workbench packages build apart, for wasm32-wasip2.
exclude = ["sdk"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"

[workspace.metadata]
description = "Workspace for the printCAD parametric CAD application."

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23"
sha2 = "0.11"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive", "rc"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26", features = ["serde", "v4"] }
winit = "0.30.13"
egui = "0.36"
egui-winit = "0.36"
egui-wgpu = "0.36"
pollster = "0.4"
bytemuck = "1.25"
directories = "6.0"
glam = { version = "0.33", features = ["std"] }
tar = "0.4.46"
flate2 = "1.1.10"
zstd = "0.14"
rustc-hash = "2.1"
rayon = "1.12"
# The standard clock on a desktop, the page's in a browser (whose target has
# none); the same types on a desktop, so nothing changes there.
web-time = "1"
ogeom = "0.9.10"
sixdof = { version = "0.2", features = ["magellan"] }
mlua = { version = "0.12", features = ["lua54", "vendored", "serde"] }
# Published for workbench packages under these names; `exhaustive` lets the
# app, which makes every variant it sends, match without a wildcard.
kernel_api = { package = "printcad-kernel-api", path = "crates/kernel_api", version = "0.1", features = ["exhaustive"] }
bench_api = { package = "printcad-bench-api", path = "crates/bench_api", version = "0.1", features = ["exhaustive"] }

# The geometry kernel is numeric code that runs unoptimized in a plain
# `cargo run`, where it is ~26x slower — enough to make a large STEP import
# look like a hang. Optimize dependencies even in dev builds; our own crates
# stay unoptimized so rebuilds are fast and backtraces stay readable.
[profile.dev.package."*"]
opt-level = 3
# Line tables keep a backtrace through a dependency readable; full debug
# info for the kernel, wasmtime, egui and the rest made each test program
# hundreds of megabytes, written again at every link.
debug = "line-tables-only"

[patch.crates-io]
# 0.36.2 with one fix: its dropped-file type builds for a browser page
# (third_party/egui-winit/PATCHED.md). Drop it once a release has the fix.
egui-winit = { path = "third_party/egui-winit" }
# Uncomment to build against a local checkout instead of the released crate:
#ogeom = { path = "../openGeometry/crates/ogeom" }
#sixdof = { path = "../sixdof" }
