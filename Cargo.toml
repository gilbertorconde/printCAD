[workspace]
members = [
  "crates/app_shell",
  "crates/core_document",
  "crates/bench_api",
    "crates/doc_server",
  "crates/kernel_api",
  "crates/kernel_ogeom",
  "crates/render_vk",
  "crates/workbenches",
  "crates/workbenches/fixtures",
  "crates/workbenches/wb_assembly",
  "crates/workbenches/wb_wasm",
"crates/settings",
"crates/axes",
  "crates/ui_kit",
  "crates/scripting",
  "crates/agents",
]
resolver = "2"
# Workbench packages build apart, for wasm32-wasip2.
exclude = ["sdk"]

# The geometry kernel is numeric code that runs unoptimized in a plain
# `cargo run`, where it is ~26x slower — enough to make a large STEP import
# look like a hang. Optimize dependencies even in dev builds; our own crates
# stay unoptimized so rebuilds are fast and backtraces stay readable.
[profile.dev.package."*"]
opt-level = 3

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"

[workspace.metadata]
description = "Workspace for the printCAD parametric CAD application."

[workspace.dependencies]
anyhow = "1.0.104"
ash = { version = "0.38", default-features = false, features = ["linked"] }
base64 = "0.23"
sha2 = "0.11"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive", "rc"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26", features = ["serde", "v4"] }
winit = "0.30.13"
raw-window-handle = "0.6.2"
egui = "0.36"
egui-winit = "0.36"
egui-ash-renderer = "0.13"
bytemuck = "1.25"
directories = "6.0"
glam = { version = "0.33", features = ["std"] }
tar = "0.4.46"
flate2 = "1.1.10"
zstd = "0.14"
rustc-hash = "2.1"
rayon = "1.12"
ogeom = "0.3.4"
sixdof = { version = "0.1", features = ["magellan"] }
mlua = { version = "0.12", features = ["lua54", "vendored", "serde"] }

# Uncomment to build against a local checkout instead of the released crate:
#[patch.crates-io]
#ogeom = { path = "../openGeometry/crates/ogeom" }
#sixdof = { path = "../sixdof" }
