<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0;background:#0F1216;color:#E6EBF0;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px}a{color:#4FA3E6;text-decoration:none}a:hover{color:#6DB5EC}*{box-sizing:border-box}</style>
</helmet>
<div data-screen-label="Preferences" style="width:1440px;height:900px;display:flex;align-items:center;justify-content:center;background:rgba(15,18,22,.85);color:#E6EBF0;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px">
  <div style="width:900px;height:620px;display:flex;flex-direction:column;border-radius:10px;background:#151A20;box-shadow:0 16px 48px rgba(0,0,0,.6),0 0 0 1px #3A4553;overflow:hidden">
    <div style="height:44px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #2B333E;gap:12px">
      <span style="font-weight:600;font-size:14px">Preferences</span>
      <div style="flex:1"></div>
      <div style="display:flex;align-items:center;gap:8px;height:28px;padding:0 10px;border:1px solid #2B333E;border-radius:5px;background:#1C222A;width:220px;color:#667180"><i style="display:inline-block;width:14px;height:14px;background:currentColor;-webkit-mask:url(icons/search.svg) center/contain no-repeat;mask:url(icons/search.svg) center/contain no-repeat"></i><span style="font-size:12px">Search settings…</span></div>
      <i style="display:inline-block;width:16px;height:16px;background:#9AA5B1;-webkit-mask:url(icons/close.svg) center/contain no-repeat;mask:url(icons/close.svg) center/contain no-repeat;cursor:pointer"></i>
    </div>
    <div style="flex:1;display:grid;grid-template-columns:200px 1fr;min-height:0">
      <div style="border-right:1px solid #2B333E;padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto">
        <sc-for list="{{ groups }}" as="g" hint-placeholder-count="8">
          <div style="height:30px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:5px;background:{{ g.bg }};color:{{ g.color }};font-size:12.5px;cursor:pointer" style-hover="background:#1C222A"><i style="display:inline-block;width:16px;height:16px;background:currentColor;-webkit-mask:url(icons/{{ g.icon }}.svg) center/contain no-repeat;mask:url(icons/{{ g.icon }}.svg) center/contain no-repeat"></i>{{ g.label }}</div>
        </sc-for>
      </div>
      <div style="display:flex;flex-direction:column;min-height:0">
        <div style="height:36px;display:flex;align-items:flex-end;gap:2px;padding:0 16px;border-bottom:1px solid #2B333E;flex:none">
          <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4"><span style="padding:8px 12px;font-size:12px;color:{{ t.color }};border-bottom:2px solid {{ t.border }};cursor:pointer">{{ t.label }}</span></sc-for>
        </div>
        <div style="flex:1;overflow:auto;padding:20px 24px;display:flex;flex-direction:column;gap:24px">
          <sc-for list="{{ sections }}" as="s" hint-placeholder-count="3">
            <div style="display:flex;flex-direction:column;gap:10px">
              <span style="font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:#667180">{{ s.title }}</span>
              <div style="display:flex;flex-direction:column;border:1px solid #2B333E;border-radius:6px;overflow:hidden">
                <sc-for list="{{ s.rows }}" as="r" hint-placeholder-count="4">
                  <div style="min-height:40px;display:flex;align-items:center;gap:16px;padding:6px 14px;border-bottom:1px solid #1C222A;background:#151A20">
                    <div style="flex:1;display:flex;flex-direction:column;gap:1px"><span style="font-size:12.5px">{{ r.label }}</span><sc-if value="{{ r.hint }}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;color:#667180">{{ r.hint }}</span></sc-if></div>
                    <sc-if value="{{ r.toggle }}" hint-placeholder-val="{{ false }}"><span style="width:34px;height:18px;border-radius:9px;background:{{ r.toggleBg }};position:relative;flex:none;transition:background .15s"><span style="position:absolute;top:2px;left:{{ r.knob }}px;width:14px;height:14px;border-radius:50%;background:{{ r.knobColor }}"></span></span></sc-if>
                    <sc-if value="{{ r.select }}" hint-placeholder-val="{{ false }}"><div style="height:26px;min-width:160px;display:flex;align-items:center;padding:0 8px;border:1px solid #2B333E;border-radius:4px;background:#1C222A;gap:6px;font-size:12px"><span style="flex:1">{{ r.value }}</span><i style="display:inline-block;width:12px;height:12px;background:#667180;-webkit-mask:url(icons/chevron-down.svg) center/contain no-repeat;mask:url(icons/chevron-down.svg) center/contain no-repeat"></i></div></sc-if>
                    <sc-if value="{{ r.qty }}" hint-placeholder-val="{{ false }}"><div style="height:26px;width:120px;display:flex;align-items:center;padding:0 8px;border:1px solid #2B333E;border-radius:4px;background:#1C222A;font-family:'IBM Plex Mono',monospace;font-size:12px">{{ r.value }}</div></sc-if>
                    <sc-if value="{{ r.swatch }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:8px"><span style="width:26px;height:18px;border-radius:3px;background:{{ r.value }};border:1px solid #3A4553"></span><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#9AA5B1;width:64px">{{ r.value }}</span></div></sc-if>
                  </div>
                </sc-for>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
    <div style="height:52px;display:flex;align-items:center;gap:8px;padding:0 16px;border-top:1px solid #2B333E;background:#1C222A">
      <button style="height:28px;padding:0 12px;border:1px solid #3A4553;border-radius:5px;background:transparent;color:#9AA5B1;font-size:12px;cursor:pointer;font-family:inherit" style-hover="background:#242C36;color:#E6EBF0">Reset page</button>
      <div style="flex:1"></div>
      <button style="height:28px;padding:0 14px;border:1px solid #3A4553;border-radius:5px;background:transparent;color:#E6EBF0;font-size:12px;cursor:pointer;font-family:inherit" style-hover="background:#242C36">Cancel</button>
      <button style="height:28px;padding:0 14px;border:1px solid #3A4553;border-radius:5px;background:transparent;color:#E6EBF0;font-size:12px;cursor:pointer;font-family:inherit" style-hover="background:#242C36">Apply</button>
      <button style="height:28px;padding:0 16px;border:0;border-radius:5px;background:#4FA3E6;color:#0B1520;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit" style-hover="background:#6DB5EC">OK</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    const G = (icon, label, on) => ({ icon, label, bg: on ? 'rgba(79,163,230,.14)' : 'transparent', color: on ? '#E6EBF0' : '#9AA5B1' });
    const Tb = (label, on) => ({ label, color: on ? '#E6EBF0' : '#9AA5B1', border: on ? '#4FA3E6' : 'transparent' });
    const tog = (label, on, hint) => ({ label, hint, toggle: true, toggleBg: on ? '#4FA3E6' : '#2C3541', knob: on ? 18 : 2, knobColor: on ? '#0B1520' : '#9AA5B1' });
    const sel = (label, value, hint) => ({ label, value, hint, select: true });
    const qty = (label, value, hint) => ({ label, value, hint, qty: true });
    const sw = (label, value) => ({ label, value, swatch: true });
    return {
      groups: [G('settings','General'), G('view-iso','Display'), G('workbench-part-design','Workbenches'), G('workbench-sketcher','Sketcher', true), G('pad','Part Design'), G('measure','Units'), G('export-stl','Import / Export'), G('print-bed','3D printing'), G('refresh','Updates')],
      tabs: [Tb('General', true), Tb('Display'), Tb('Colors'), Tb('Grid')],
      sections: [
        { title: 'Solver & constraints', rows: [ tog('Auto constraints', true, 'Add coincident, horizontal, vertical while drawing'), tog('Avoid redundant auto constraints', true), tog('Auto remove redundants', true), tog('Notify about redundant constraints', false), sel('Unify coincident & point-on-object', 'Single tool', 'One constraint tool picks by selection') ] },
        { title: 'Dimensions', rows: [ sel('Dimensional constraint mode', 'Unified (auto)', 'Distance, radius, angle chosen from selection'), tog('Ask for value after creation', true, 'Opens the on-view parameter box'), tog('On-view parameters', true, 'Type dimensions while drawing'), qty('Segments per geometry', '50') ] },
        { title: 'Visual', rows: [ tog('Hide dependent objects when editing', true), tog('Show grid', true), qty('Grid size', '10 mm'), sel('Grid style', 'Lines'), tog('Snap to grid', true), tog('Snap to objects', true), qty('Snap angle', '5 °') ] },
        { title: 'Colors', rows: [ sw('Normal geometry', '#E6EBF0'), sw('Construction', '#4FA3E6'), sw('External geometry', '#C77DFF'), sw('Fully constrained', '#4FD08F'), sw('Constraints', '#E6A44F'), sw('Reference dimension', '#4FA3E6'), sw('Selected', '#7CC4F5'), sw('Preselected', '#F2D479') ] },
      ],
    };
  }
}
</script>
</body>
</html>
