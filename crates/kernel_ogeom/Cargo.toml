[package]
name = "kernel_ogeom"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Compiles and runs the integration tests that need a big model or a long
# build (the `heavy` modules); `node scripts/test-budget.mjs --heavy` runs
# them. Nothing outside tests reads it.
heavy-tests = []

[dependencies]
kernel_api.workspace = true
ogeom = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde_json.workspace = true

[dev-dependencies]
sketch_solver = { path = "../sketch_solver" }
tracing-subscriber = { workspace = true }
core_document = { path = "../core_document", features = ["test-support"] }
wb_design = { path = "../workbenches/wb_design" }
wb_sketch = { path = "../workbenches/wb_sketch" }
wb_surface = { path = "../workbenches/wb_surface" }
scripting = { path = "../scripting" }
image = { workspace = true, features = ["png"] }
