[package]
name = "core_document"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
egui = ["dep:egui", "dep:ui_kit"]

[dependencies]
web-time.workspace = true
surface_texture = { path = "../surface_texture" }
base64.workspace = true
tracing = { workspace = true }
serde.workspace = true
thiserror.workspace = true
serde_json.workspace = true
glam.workspace = true
uuid.workspace = true
egui = { workspace = true, optional = true }
ui_kit = { path = "../ui_kit", optional = true }
tar.workspace = true
flate2.workspace = true
zstd.workspace = true
# Bodies' meshes in an archive: compact entries beside their shapes.
rmp-serde = "1"
kernel_api.workspace = true
bench_api.workspace = true

# In a browser, ids draw their randomness from the page.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
