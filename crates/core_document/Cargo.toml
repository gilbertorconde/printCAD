[package]
name = "core_document"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
egui = ["dep:egui", "dep:ui_kit"]
# `testing`: what benches' tests share. Only dev-dependencies turn it on.
test-support = []

[dependencies]
surface_texture = { path = "../surface_texture" }
feature_walk = { path = "../feature_walk" }
metrology = { path = "../metrology" }
base64.workspace = true
tracing = { workspace = true }
serde.workspace = true
thiserror.workspace = true
serde_json.workspace = true
glam.workspace = true
uuid.workspace = true
egui = { workspace = true, optional = true }
ui_kit = { path = "../ui_kit", optional = true }
tar.workspace = true
flate2.workspace = true
zstd.workspace = true
# Bodies' meshes in an archive: compact entries beside their shapes.
rmp-serde.workspace = true
kernel_api.workspace = true
bench_api.workspace = true

