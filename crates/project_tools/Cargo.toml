[package]
name = "project_tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Archive project reader, document converter and parity checks"

[features]
# The local project-corpus test entry point (tests/projects/corpus.rs).
heavy-tests = []

[dependencies]
core_document = { path = "../core_document" }
sketch_model = { path = "../sketch_model" }
wb_design = { path = "../workbenches/wb_design" }
kernel_api.workspace = true
kernel_ogeom = { path = "../kernel_ogeom" }
glam.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
project_archive = { path = "../project_archive", version = "0.1.0" }

[dev-dependencies]
core_document = { path = "../core_document", features = ["test-support"] }
zip = { workspace = true, features = ["deflate"] }
