[package]
name = "app_shell"
version = "0.12.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "printcad"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
viewport_camera = { path = "../viewport_camera" }
local_ipc = { path = "../local_ipc" }
anyhow.workspace = true
agents = { path = "../agents" }
base64.workspace = true
core_document = { path = "../core_document", features = ["egui"] }
render_wgpu = { path = "../render_wgpu" }
tracing.workspace = true
tracing-subscriber.workspace = true
winit.workspace = true
egui.workspace = true
workbenches = { path = "../workbenches" }
bench_fixtures = { path = "../workbenches/fixtures" }
kernel_api.workspace = true
kernel_ogeom = { path = "../kernel_ogeom" }
settings = { path = "../settings" }
ui_kit = { path = "../ui_kit" }
glam.workspace = true
uuid.workspace = true
axes = { path = "../axes" }
resvg = "0.48"
usvg = "0.48"
tiny-skia = "0.12"
png = "0.18"
gif = "0.14"
serde_json.workspace = true
serde.workspace = true
surface_texture = { path = "../surface_texture" }
sixdof = { workspace = true }

egui-winit.workspace = true
doc_server = { path = "../doc_server" }
scripting = { path = "../scripting" }
tracing-appender.workspace = true
rfd = "0.17"
# Pictures pasted into a chat; egui's own clipboard reads only text.
# What a chat tells the user while the window is in the background.
notify-rust = "4.18"
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
