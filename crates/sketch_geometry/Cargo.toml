[package]
name = "sketch_geometry"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
glam = { workspace = true, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
sketch_units = { path = "../sketch_units" }

[dev-dependencies]
proptest = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
