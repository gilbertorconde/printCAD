[package]
name = "wb_inspect"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["egui"]
egui = ["core_document/egui", "dep:egui", "dep:ui_kit", "dep:bench_panel"]

[dependencies]
egui = { workspace = true, optional = true }
ui_kit = { path = "../../ui_kit", optional = true }
core_document = { path = "../../core_document" }
bench_panel = { path = "../../bench_panel", optional = true }
bench_api.workspace = true
glam = { workspace = true }
kernel_api.workspace = true
metrology = { path = "../../metrology" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
core_document = { path = "../../core_document", features = ["test-support"] }
kernel_ogeom = { path = "../../kernel_ogeom" }
ui_kit = { path = "../../ui_kit" }
