[package]
name = "workbenches"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
core_document = { path = "../core_document" }
wb_sketch = { path = "wb_sketch" }
wb_design = { path = "wb_design" }
wb_assembly = { path = "wb_assembly" }
wb_surface = { path = "wb_surface" }
project_tools = { path = "../project_tools" }
tracing.workspace = true



[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wb_wasm = { path = "wb_wasm" }

# A browser page runs no packages: what they and the store say still reads.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wb_wasm = { path = "wb_wasm", default-features = false, features = ["egui"] }
serde_json.workspace = true
