[package]
name = "wb_surface"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["egui"]
egui = ["core_document/egui", "dep:egui", "dep:ui_kit", "dep:bench_panel"]

[dependencies]
core_document = { path = "../../core_document" }
bench_panel = { path = "../../bench_panel", optional = true }
bench_api.workspace = true
kernel_api.workspace = true
glam = { workspace = true }
wb_sketch = { path = "../wb_sketch", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
egui = { workspace = true, optional = true }
ui_kit = { path = "../../ui_kit", optional = true }

[dev-dependencies]
core_document = { path = "../../core_document", features = ["test-support"] }
