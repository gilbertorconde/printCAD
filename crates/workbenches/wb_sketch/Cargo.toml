[package]
name = "wb_sketch"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["egui"]
egui = ["core_document/egui", "dep:egui", "dep:ui_kit"]

[dependencies]
sketch_solver = { path = "../../sketch_solver" }
web-time.workspace = true
core_document = { path = "../../core_document" }
egui = { workspace = true, optional = true }
ui_kit = { path = "../../ui_kit", optional = true }
glam.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
kernel_api.workspace = true
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
sketch_solver = { path = "../../sketch_solver", features = ["serde"] }
scripting = { path = "../../scripting" }
