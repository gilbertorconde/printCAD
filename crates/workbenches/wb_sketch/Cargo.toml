[package]
name = "wb_sketch"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["egui"]
egui = ["dep:egui", "dep:ui_kit", "dep:bench_panel"]

[dependencies]
sketch_solver = { path = "../../sketch_solver" }
sketch_model = { path = "../../sketch_model" }
metrology = { path = "../../metrology" }
image_edges = { path = "../../image_edges" }
core_document = { path = "../../core_document" }
bench_panel = { path = "../../bench_panel", optional = true }
bench_api.workspace = true
egui = { workspace = true, optional = true }
ui_kit = { path = "../../ui_kit", optional = true }
glam.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
settings = { path = "../../settings" }
kernel_api.workspace = true
image = { workspace = true, features = ["png", "jpeg"] }

[dev-dependencies]
core_document = { path = "../../core_document", features = ["test-support"] }
sketch_solver = { path = "../../sketch_solver", features = ["serde"] }
scripting = { path = "../../scripting" }
kernel_ogeom = { path = "../../kernel_ogeom" }
