[package]
name = "wb_mesh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["egui"]
egui = ["core_document/egui", "dep:egui", "dep:bench_panel"]

[dependencies]
core_document = { path = "../../core_document" }
bench_panel = { path = "../../bench_panel", optional = true }
kernel_api.workspace = true
bench_api.workspace = true
egui = { workspace = true, optional = true }
metrology = { path = "../../metrology" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
ui_kit = { path = "../../ui_kit" }
