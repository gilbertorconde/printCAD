[package]
name = "wb_assembly"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["egui"]
egui = ["core_document/egui", "dep:egui", "dep:ui_kit"]

[dependencies]
bench_api.workspace = true
core_document = { path = "../../core_document" }
kernel_api.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
glam.workspace = true
uuid = { workspace = true }
# The Move task's handles, and the screen points they take and give.
transform_gizmo = { path = "../../transform_gizmo" }
emath = "0.36"
egui = { workspace = true, optional = true }
ui_kit = { path = "../../ui_kit", optional = true }
