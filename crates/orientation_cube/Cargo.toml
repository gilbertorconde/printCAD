[package]
name = "orientation_cube"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The view's orientation cube: faces, edges and corners to snap to, arrows to turn by, drawn with egui."

[dependencies]
axes = { path = "../axes" }
egui.workspace = true
glam.workspace = true
kernel_api.workspace = true
# The cube's faces are text; it falls back on system fonts.
resvg = { workspace = true, features = ["text", "system-fonts", "memmap-fonts"] }
tiny-skia.workspace = true
ui_kit = { path = "../ui_kit" }
usvg = { workspace = true, features = ["text", "system-fonts", "memmap-fonts"] }
