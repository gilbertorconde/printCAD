name: Pages

# The website: site/ (landing page, stylesheet, pictures) and every guide
# in docs/ turned into a page by scripts/build-site.sh, published to
# GitHub Pages on each push to master that touches them.

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "docs/**"
      - "scripts/build-site.sh"
      - "crates/app_shell/assets/icon/**"
      - "crates/ui_kit/fonts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      # Pinned: the code colours read the classes this version's
      # highlighter gives.
      - name: Pandoc
        run: |
          curl -sSLo pandoc.deb https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-1-amd64.deb
          sudo dpkg -i pandoc.deb
          rm pandoc.deb

      - name: Build the site
        run: scripts/build-site.sh _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
