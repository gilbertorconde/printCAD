name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The browser build compiles what a desktop leaves out.
      - name: Clippy for a browser page
        run: cargo clippy -p app_shell --target wasm32-unknown-unknown -- -D warnings

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Tests, within their time budget
        run: node scripts/test-budget.mjs

      - name: Standalone solver dependencies and features
        run: |
          node scripts/check-solver-deps.mjs
          cargo test -p sketch_solver --locked
          cargo test -p sketch_solver --no-default-features --locked
          cargo test -p sketch_solver --features serde --locked
          cargo clippy -p sketch_solver --all-targets --no-default-features --locked -- -D warnings
          cargo clippy -p sketch_solver --all-targets --features serde --locked -- -D warnings
          cargo check -p sketch_solver --all-features --target wasm32-unknown-unknown --locked
          cargo check -p sketch_solver --all-features --target wasm32-wasip2 --locked

      - name: Comment-rot lint
        run: node scripts/lint-comment-rot.mjs --all

      - name: The host names no workbench
        run: "! git grep -nE 'wb_design|wb_sketch|\"wb\\.(design|part|sketch)\"|core\\.datum' -- crates/app_shell/src ':!crates/app_shell/src/app/seam_lint.rs'"

  platforms:
    # Windows and macOS: the same build, lints and tests as Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
