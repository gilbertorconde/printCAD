name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        # libvulkan-dev: ash uses the "linked" feature (links libvulkan at build time).
        # glslc/libshaderc: render_vk's build.rs compiles GLSL via shaderc.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev glslc libshaderc-dev

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Comment-rot lint
        run: node scripts/lint-comment-rot.mjs --all

      - name: The host names no workbench
        run: "! git grep -nE 'wb_part|wb_sketch|\"wb\\.(part|sketch)\"|core\\.datum' -- crates/app_shell/src ':!crates/app_shell/src/app/seam_lint.rs'"
